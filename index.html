<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEX Dragons · Очереди (просмотр)</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  /* ---------- ЛОКАЛЬНЫЙ ФИКС ДЛЯ СПИСКА ТЕМ ---------- */
  .theme-option {
    display: flex !important;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-radius: 14px;
    cursor: pointer;
    border: 1px solid var(--app-border, #ccc);
    margin-bottom: 8px;
    background: var(--row-hover, rgba(0,0,0,.05));
    transition: background .2s, border-color .2s;
  }
  .theme-option:hover {
    border-color: var(--accent-2, #888);
  }
  .theme-option input[type="radio"] {
    accent-color: var(--accent-hover, #666);
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    margin: 0;
  }
  .theme-option span {
    font-weight: 600;
    display: inline-block;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div class="app-container">
  <div class="clan-title">[DEX] Dragons</div>
  <div class="sub-title">Список очередей</div>

  <div class="top-bar">
    <button class="players-btn" id="boostersBtn"><i class="fa-solid fa-table-list"></i> Таблица баффов</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="build">Строительство</button>
    <button class="tab-btn" data-tab="research">Исследования</button>
    <button class="gear-btn" id="themeBtn" title="Тема"><i class="fa-solid fa-palette"></i></button>
  </div>

  <div class="action-bar">
    <button class="action-btn" id="copy1_10"><i class="fa-solid fa-copy"></i> 1-10</button>
    <button class="action-btn" id="copy11_20"><i class="fa-solid fa-copy"></i> 11-20</button>
    <button class="action-btn" id="copy21_30"><i class="fa-solid fa-copy"></i> 21-30</button>
  </div>

  <div class="table-outer">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="sticky-col sticky-num">№</th>
            <th class="sticky-col sticky-nick">Ник</th>
            <th>Дней</th>
            <th>Баффы</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
  import { getFirestore, doc, getDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAzYjdptHeeE3ZgxCHPZ6aobhZO8X2bNB4",
    authDomain: "dexbuffs.firebaseapp.com",
    projectId: "dexbuffs",
    storageBucket: "dexbuffs.firebasestorage.app",
    messagingSenderId: "990670463735",
    appId: "1:990670463735:web:d58f2e04f705899d5ca9f2",
    measurementId: "G-V1KBGHSPTE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  signInAnonymously(auth).catch(err => console.error('Auth error:', err));

  onAuthStateChanged(auth, user => {
    if (user) {
      window.firebaseDB = { db, doc, getDoc, onSnapshot, auth };
      console.log('Firebase готов, UID:', user.uid);
    }
  });
</script>

<script>
(function(){
  "use strict";

  let currentTab = 'build';
  let queues = { build: [], research: [] };
  let settings = {
    build:    { targetDays: 7, calcType: 'fixed', fixedPercent: 10, avg5: 0, avg10: 0, avg15: 0 },
    research: { targetDays: 7, calcType: 'fixed', fixedPercent: 10, avg5: 0, avg10: 0, avg15: 0 }
  };
  let currentTheme = 'light';

  const $ = id => document.getElementById(id);

  // ---------- ТЕМА (через localStorage) ----------
  const THEMES = ['light', 'dark', 'purple', 'orange', 'blue'];
  const THEME_NAMES = {
    light: 'Светлая', dark: 'Тёмная', purple: 'Фиолетовая',
    orange: 'Оранжевая', blue: 'Голубая'
  };
  const THEME_KEY = 'dexbuffs_view_theme';

  function loadThemeFromStorage() {
    try { return localStorage.getItem(THEME_KEY) || 'light'; }
    catch(e){ return 'light'; }
  }

  function saveThemeToStorage(theme) {
    try { localStorage.setItem(THEME_KEY, theme); }
    catch(e){ /* noop */ }
  }

  function applyTheme(theme) {
    currentTheme = theme;
    if (theme === 'light') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', theme);
  }

  // ---------- FIREBASE ----------
  function waitForFirebase() {
    return new Promise((resolve, reject) => {
      let attempts = 0;
      const check = () => {
        if (window.firebaseDB) resolve();
        else if (++attempts > 200) reject(new Error('Firebase timeout'));
        else setTimeout(check, 50);
      };
      check();
    });
  }

  async function loadData() {
    await waitForFirebase();
    const { db, doc, getDoc } = window.firebaseDB;
    try {
      const [qB, qR, sB, sR] = await Promise.all([
        getDoc(doc(db, 'queues', 'build')),
        getDoc(doc(db, 'queues', 'research')),
        getDoc(doc(db, 'settings', 'build')),
        getDoc(doc(db, 'settings', 'research'))
      ]);
      if (qB.exists()) queues.build    = qB.data().list || [];
      if (qR.exists()) queues.research = qR.data().list || [];
      if (sB.exists()) settings.build    = { ...settings.build,    ...sB.data() };
      if (sR.exists()) settings.research = { ...settings.research, ...sR.data() };
    } catch(e){ console.error('loadData error:', e); }
  }

  function subscribeToChanges() {
    const { db, doc, onSnapshot } = window.firebaseDB;

    ['build', 'research'].forEach(tab => {
      onSnapshot(doc(db, 'settings', tab), (snap) => {
        if (!snap.exists()) return;
        settings[tab] = { ...settings[tab], ...snap.data() };
        const s = settings[tab];
        queues[tab].forEach(item => {
          item.boosters = calculateBoosters(item.days, s);
        });
        if (tab === currentTab) renderTable();
      });
    });

    ['build', 'research'].forEach(tab => {
      onSnapshot(doc(db, 'queues', tab), (snap) => {
        if (!snap.exists()) return;
        queues[tab] = snap.data().list || [];
        const s = settings[tab];
        queues[tab].forEach(item => {
          item.boosters = calculateBoosters(item.days, s);
        });
        if (tab === currentTab) renderTable();
      });
    });
  }

  // ---------- РАСЧЁТ ----------
  function calculateBoosters(days, s) {
    const target = s.targetDays;
    if (days <= target) return 0;

    let pct;
    if (s.calcType === 'fixed') {
      pct = s.fixedPercent / 100;
    } else {
      const total = (s.avg5||0) + (s.avg10||0) + (s.avg15||0);
      if (total <= 0) return '—';
      pct = (5*(s.avg5||0) + 10*(s.avg10||0) + 15*(s.avg15||0)) / total / 100;
    }

    if (pct <= 0 || pct >= 1) return '—';
    return Math.ceil( Math.log(target / days) / Math.log(1 - pct) );
  }

  function recalcAll() {
    ['build','research'].forEach(tab => {
      const s = settings[tab];
      queues[tab].forEach(item => {
        item.boosters = calculateBoosters(item.days, s);
      });
    });
  }

  // ---------- РЕНДЕР ----------
  function renderTable() {
    const tbody = $('tableBody');
    const list = queues[currentTab];
    tbody.innerHTML = '';

    if (!list.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="4" class="empty-message">Очередь пуста.</td>`;
      tbody.appendChild(tr);
      return;
    }

    list.forEach((item, idx) => {
      const tr = document.createElement('tr');

      const tdNum = document.createElement('td');
      tdNum.className = 'sticky-col sticky-num';
      tdNum.textContent = idx + 1;
      tr.appendChild(tdNum);

      const tdNick = document.createElement('td');
      tdNick.className = 'sticky-col sticky-nick';
      tdNick.textContent = item.nick;
      tdNick.title = item.nick;
      tr.appendChild(tdNick);

      const tdDays = document.createElement('td');
      tdDays.textContent = item.days;
      tr.appendChild(tdDays);

      const tdBoost = document.createElement('td');
      tdBoost.textContent = (item.boosters === undefined || item.boosters === null) ? '—' : item.boosters;
      tr.appendChild(tdBoost);

      tbody.appendChild(tr);
    });
  }

  // ---------- КОПИРОВАНИЕ ----------
  function copyRange(from, to) {
    const list = queues[currentTab];
    const label = currentTab === 'build' ? 'Стройка' : 'Исследования';
    const slice = list.slice(from - 1, to);
    if (!slice.length) return alert(`В диапазоне ${from}-${to} нет игроков`);
    const lines = slice.map((it, i) => `${from + i}. ${it.nick}: ${it.boosters ?? '—'}`);
    const text = `Очередь ${label}:\n` + lines.join('\n');

    navigator.clipboard.writeText(text).then(
      () => alert('Скопировано:\n\n' + text),
      () => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
        alert('Скопировано:\n\n' + text);
      }
    );
  }

  // ---------- ТАБЛИЦА БАФФОВ ----------
  function computeBoostersForDays(days, pct, target) {
    if (days <= target) return 0;
    if (pct <= 0 || pct >= 1) return '—';
    return Math.ceil( Math.log(target / days) / Math.log(1 - pct) );
  }

  function groupBoosters(minDay, maxDay, pct, target) {
    const groups = [];
    let cur = null;
    for (let d = minDay; d <= maxDay; d++) {
      const n = computeBoostersForDays(d, pct, target);

      if (n === '—' || typeof n !== 'number' || n < 3) {
        if (cur) { groups.push(cur); cur = null; }
        continue;
      }

      if (cur && cur.n === n && cur.end === d - 1) {
        cur.end = d;
      } else {
        if (cur) groups.push(cur);
        cur = { start: d, end: d, n };
      }
    }
    if (cur) groups.push(cur);
    if (groups.length) groups[groups.length - 1].plus = true;
    return groups;
  }

  function groupLabel(g) {
    if (g.start === g.end) return `${g.start}${g.plus ? '+' : ''}`;
    return `${g.start}-${g.end}${g.plus ? '+' : ''}`;
  }

  function openModal(html, onReady, extraClass = '') {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-window ${extraClass}">${html}</div>`;
    document.body.appendChild(overlay);

    const close = () => {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);

    if (onReady) onReady(overlay.querySelector('.modal-window'), close);
    return close;
  }

  function openBoostersTableModal() {
    let currentTarget = settings[currentTab].targetDays;

    function buildColumns(target) {
      const cols = [5, 10, 15];
      return `<div class="boosters-grid">` + cols.map(pct => {
        const groups = groupBoosters(10, 150, pct / 100, target);
        const rows = groups.map(g =>
          `<li><span class="days">${groupLabel(g)}</span><span class="count">${g.n} шт.</span></li>`
        ).join('');
        return `
          <div class="boosters-col" data-pct="${pct}">
            <div class="boosters-col-header">
              <i class="fa-solid fa-chevron-right arrow-icon"></i>
              <h4>${pct}%</h4>
              <button class="copy-col-btn" data-pct="${pct}" title="Скопировать"><i class="fa-solid fa-copy"></i></button>
            </div>
            <div class="boosters-col-body">
              <ul>${rows}</ul>
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }

    openModal(`
      <h3>Таблица баффов</h3>
      <div class="target-switch">
        <button class="target-btn" data-target="7"><i class="fa-solid fa-bullseye"></i> До 7 дней</button>
        <button class="target-btn" data-target="10"><i class="fa-solid fa-bullseye"></i> До 10 дней</button>
      </div>
      <div id="boostersContent"></div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="bClose"><i class="fa-solid fa-xmark"></i> Закрыть</button>
      </div>
    `, (win, close) => {
      function render() {
        win.querySelector('#boostersContent').innerHTML = buildColumns(currentTarget);

        win.querySelectorAll('.target-btn').forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.target, 10) === currentTarget);
        });

        win.querySelectorAll('.boosters-col').forEach(col => {
          const header  = col.querySelector('.boosters-col-header');
          const copyBtn = col.querySelector('.copy-col-btn');

          header.onclick = (e) => {
            if (e.target.closest('.copy-col-btn')) return;

            const wasExpanded = col.classList.contains('expanded');

            // Закрываем все колонки
            win.querySelectorAll('.boosters-col').forEach(c => c.classList.remove('expanded'));

            // Если текущая была свёрнута — раскрываем её
            if (!wasExpanded) col.classList.add('expanded');
          };

          copyBtn.onclick = (e) => {
            e.stopPropagation();
            const pct = parseInt(copyBtn.dataset.pct, 10);
            const groups = groupBoosters(10, 150, pct / 100, currentTarget);
            const lines = groups.map(g => `${groupLabel(g)}: ${g.n} шт.`);
            const text = `Количество баффов на количество дней:\n` + lines.join('\n');
            navigator.clipboard.writeText(text).then(
              () => alert(`Скопировано (${pct}%):\n\n` + text),
              () => {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); ta.remove();
                alert(`Скопировано (${pct}%):\n\n` + text);
              }
            );
          };
        });
      }

      win.querySelectorAll('.target-btn').forEach(b => {
        b.onclick = () => {
          currentTarget = parseInt(b.dataset.target, 10);
          render();
        };
      });

      win.querySelector('#bClose').onclick = close;
      render();
    }, 'wide');
  }

  // ---------- ВЫБОР ТЕМЫ ----------
  function openThemeModal() {
    const options = THEMES.map(t => `
      <label class="theme-option">
        <input type="radio" name="themePick" value="${t}" ${t===currentTheme?'checked':''}>
        <span>${THEME_NAMES[t]}</span>
      </label>
    `).join('');

    openModal(`
      <h3>Выбор темы</h3>
      <div>${options}</div>
      <div class="modal-actions">
        <button class="modal-btn primary" id="themeSave"><i class="fa-solid fa-check"></i> Применить</button>
      </div>
    `, (win, close) => {
      win.querySelector('#themeSave').onclick = () => {
        const picked = win.querySelector('input[name="themePick"]:checked').value;
        applyTheme(picked);
        saveThemeToStorage(picked);
        close();
      };
    });
  }

  // ---------- СОБЫТИЯ ----------
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderTable();
    });
  });

  $('boostersBtn').addEventListener('click', openBoostersTableModal);
  $('themeBtn').addEventListener('click', openThemeModal);
  $('copy1_10').addEventListener('click', () => copyRange(1, 10));
  $('copy11_20').addEventListener('click', () => copyRange(11, 20));
  $('copy21_30').addEventListener('click', () => copyRange(21, 30));

  // ---------- СТАРТ ----------
  applyTheme(loadThemeFromStorage());

  (async () => {
    try {
      await waitForFirebase();
      await loadData();
      recalcAll();
      renderTable();
      subscribeToChanges();
    } catch(e) {
      console.error('Ошибка инициализации:', e);
      alert('Не удалось подключиться к базе данных. Проверьте интернет и обновите страницу.');
    }
  })();

})();
</script>
</body>
</html>
