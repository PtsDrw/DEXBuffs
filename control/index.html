<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEX Dragons · Очереди</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-container">
  <div class="clan-title">[DEX] Dragons</div>
  <div class="sub-title">Список очередей</div>

  <div class="top-bar">
    <button class="players-btn" id="playersBtn"><i class="fa-solid fa-users"></i> Список игроков</button>
    <button class="players-btn" id="boostersBtn"><i class="fa-solid fa-table-list"></i> Таблица баффов</button>
    <button class="players-btn danger" id="clearQueuesBtn"><i class="fa-solid fa-trash-can"></i> Очистить все очереди</button>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="build">Строительство</button>
    <button class="tab-btn" data-tab="research">Исследования</button>
    <button class="gear-btn" id="gearBtn" title="Настройки"><i class="fa-solid fa-gear"></i></button>
    <button class="gear-btn" id="themeBtn" title="Тема"><i class="fa-solid fa-palette"></i></button>
  </div>

  <div class="action-bar">
    <button class="action-btn" id="recordBtn"><i class="fa-solid fa-plus"></i> Записать</button>
    <button class="action-btn" id="rewriteBtn"><i class="fa-solid fa-rotate-right"></i> Перезаписать</button>
    <button class="action-btn" id="editBtn" disabled><i class="fa-solid fa-pen"></i> Изменить</button>
    <button class="action-btn" id="finishBtn"><i class="fa-solid fa-check"></i> Завершить</button>
    <button class="action-btn" id="copy1_10"><i class="fa-solid fa-copy"></i> 1-10</button>
    <button class="action-btn" id="copy11_20"><i class="fa-solid fa-copy"></i> 11-20</button>
    <button class="action-btn" id="copy21_30"><i class="fa-solid fa-copy"></i> 21-30</button>
  </div>

  <div class="table-outer">
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th class="sticky-col sticky-num">№</th>
            <th class="sticky-col sticky-nick">Ник</th>
            <th>Дней</th>
            <th>Баффы</th>
            <th>✓</th>
            <th><i class="fa-solid fa-arrows-up-down"></i></th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js';
  import { getFirestore, doc, getDoc, setDoc, onSnapshot } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAzYjdptHeeE3ZgxCHPZ6aobhZO8X2bNB4",
    authDomain: "dexbuffs.firebaseapp.com",
    projectId: "dexbuffs",
    storageBucket: "dexbuffs.firebasestorage.app",
    messagingSenderId: "990670463735",
    appId: "1:990670463735:web:d58f2e04f705899d5ca9f2",
    measurementId: "G-V1KBGHSPTE"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  signInAnonymously(auth).catch(err => console.error('Auth error:', err));

  onAuthStateChanged(auth, user => {
    if (user) {
      window.firebaseDB = { db, doc, getDoc, setDoc, onSnapshot, auth };
      console.log('Firebase готов, UID:', user.uid);
    }
  });
</script>

<script>
(function(){
  "use strict";

  let currentTab = 'build';
  let queues = { build: [], research: [] };
  let settings = {
    build:    { targetDays: 7, calcType: 'fixed', fixedPercent: 10, avg5: 0, avg10: 0, avg15: 0 },
    research: { targetDays: 7, calcType: 'fixed', fixedPercent: 10, avg5: 0, avg10: 0, avg15: 0 }
  };
  let selectedIds = new Set();
  let playersList = [];
  let currentTheme = 'light';

  const $ = id => document.getElementById(id);
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const genId = () => Date.now() + '_' + Math.random().toString(36).slice(2, 9);

  function waitForFirebase() {
    return new Promise((resolve, reject) => {
      let attempts = 0;
      const check = () => {
        if (window.firebaseDB) resolve();
        else if (++attempts > 200) reject(new Error('Firebase timeout'));
        else setTimeout(check, 50);
      };
      check();
    });
  }

  async function saveQueues() {
    if (!window.firebaseDB) return;
    const { db, doc, setDoc } = window.firebaseDB;
    try {
      await Promise.all([
        setDoc(doc(db, 'queues', 'build'),    { list: queues.build }),
        setDoc(doc(db, 'queues', 'research'), { list: queues.research })
      ]);
    } catch(e){ console.error('saveQueues error:', e); }
  }

  async function saveSettings() {
    if (!window.firebaseDB) return;
    const { db, doc, setDoc } = window.firebaseDB;
    try {
      await Promise.all([
        setDoc(doc(db, 'settings', 'build'),    settings.build),
        setDoc(doc(db, 'settings', 'research'), settings.research)
      ]);
    } catch(e){ console.error('saveSettings error:', e); }
  }

  async function loadData() {
    await waitForFirebase();
    const { db, doc, getDoc } = window.firebaseDB;
    try {
      const [qB, qR, sB, sR] = await Promise.all([
        getDoc(doc(db, 'queues', 'build')),
        getDoc(doc(db, 'queues', 'research')),
        getDoc(doc(db, 'settings', 'build')),
        getDoc(doc(db, 'settings', 'research'))
      ]);
      if (qB.exists()) queues.build    = qB.data().list || [];
      if (qR.exists()) queues.research = qR.data().list || [];
      if (sB.exists()) settings.build    = { ...settings.build,    ...sB.data() };
      if (sR.exists()) settings.research = { ...settings.research, ...sR.data() };
    } catch(e){ console.error('loadData error:', e); }
  }

  async function loadPlayers() {
    await waitForFirebase();
    const { db, doc, getDoc } = window.firebaseDB;
    try {
      const snap = await getDoc(doc(db, 'players', 'list'));
      playersList = snap.exists() ? (snap.data().players || []) : [];
    } catch(e){ console.warn(e); playersList = []; }
  }

  async function savePlayers() {
    const { db, doc, setDoc } = window.firebaseDB;
    try {
      await setDoc(doc(db, 'players', 'list'), { players: playersList });
    } catch(e){ console.error('savePlayers error:', e); }
  }

  function subscribeToChanges() {
    const { db, doc, onSnapshot } = window.firebaseDB;

    ['build', 'research'].forEach(tab => {
      onSnapshot(doc(db, 'settings', tab), (snap) => {
        if (!snap.exists()) return;
        settings[tab] = { ...settings[tab], ...snap.data() };
        const s = settings[tab];
        queues[tab].forEach(item => {
          item.boosters = calculateBoosters(item.days, s);
        });
        if (tab === currentTab) renderTable();
      });
    });

    ['build', 'research'].forEach(tab => {
      onSnapshot(doc(db, 'queues', tab), (snap) => {
        if (!snap.exists()) return;
        queues[tab] = snap.data().list || [];
        const s = settings[tab];
        queues[tab].forEach(item => {
          item.boosters = calculateBoosters(item.days, s);
        });
        if (tab === currentTab) renderTable();
      });
    });

    onSnapshot(doc(db, 'players', 'list'), (snap) => {
      if (snap.exists()) playersList = snap.data().players || [];
    });
  }

  const THEMES = ['light', 'dark', 'purple', 'orange', 'blue'];
  const THEME_NAMES = {
    light: 'Светлая', dark: 'Тёмная', purple: 'Фиолетовая',
    orange: 'Оранжевая', blue: 'Голубая'
  };

  async function loadUserTheme() {
    await waitForFirebase();
    const { db, doc, getDoc, auth } = window.firebaseDB;
    const uid = auth.currentUser?.uid;
    if (!uid) return 'light';
    try {
      const snap = await getDoc(doc(db, 'userPrefs', uid));
      if (snap.exists() && snap.data().theme) return snap.data().theme;
    } catch(e){ console.warn(e); }
    return 'light';
  }

  async function saveUserTheme(theme) {
    const { db, doc, setDoc, auth } = window.firebaseDB;
    const uid = auth.currentUser?.uid;
    if (!uid) return;
    try { await setDoc(doc(db, 'userPrefs', uid), { theme }, { merge: true }); }
    catch(e){ console.error(e); }
  }

  function applyTheme(theme) {
    currentTheme = theme;
    if (theme === 'light') document.body.removeAttribute('data-theme');
    else document.body.setAttribute('data-theme', theme);
  }

  function calculateBoosters(days, s) {
    const target = s.targetDays;
    if (days <= target) return 0;

    let pct;
    if (s.calcType === 'fixed') {
      pct = s.fixedPercent / 100;
    } else {
      const total = (s.avg5||0) + (s.avg10||0) + (s.avg15||0);
      if (total <= 0) return '—';
      pct = (5*(s.avg5||0) + 10*(s.avg10||0) + 15*(s.avg15||0)) / total / 100;
    }

    if (pct <= 0 || pct >= 1) return '—';
    return Math.ceil( Math.log(target / days) / Math.log(1 - pct) );
  }

  function recalcAll() {
    ['build','research'].forEach(tab => {
      const s = settings[tab];
      queues[tab].forEach(item => {
        item.boosters = calculateBoosters(item.days, s);
      });
    });
  }

  function renderTable() {
    const tbody = $('tableBody');
    const list = queues[currentTab];
    tbody.innerHTML = '';

    if (!list.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="6" class="empty-message">Очередь пуста. Нажмите «Записать».</td>`;
      tbody.appendChild(tr);
      updateEditButton();
      return;
    }

    list.forEach((item, idx) => {
      const tr = document.createElement('tr');

      const tdNum = document.createElement('td');
      tdNum.className = 'sticky-col sticky-num';
      tdNum.textContent = idx + 1;
      tr.appendChild(tdNum);

      const tdNick = document.createElement('td');
      tdNick.className = 'sticky-col sticky-nick';
      tdNick.textContent = item.nick;
      tdNick.title = item.nick;
      tr.appendChild(tdNick);

      const tdDays = document.createElement('td');
      tdDays.textContent = item.days;
      tr.appendChild(tdDays);

      const tdBoost = document.createElement('td');
      tdBoost.textContent = (item.boosters === undefined || item.boosters === null) ? '—' : item.boosters;
      tr.appendChild(tdBoost);

      const tdCheck = document.createElement('td');
      tdCheck.className = 'checkbox-cell';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = selectedIds.has(item.id);
      cb.addEventListener('change', e => {
        if (e.target.checked) selectedIds.add(item.id);
        else selectedIds.delete(item.id);
        updateEditButton();
      });
      tdCheck.appendChild(cb);
      tr.appendChild(tdCheck);

      const tdArrows = document.createElement('td');
      const up = document.createElement('button');
      up.className = 'arrow-btn';
      up.innerHTML = '<i class="fa-solid fa-arrow-up"></i>';
      up.disabled = idx === 0;
      up.onclick = () => moveItem(item.id, -1);
      const down = document.createElement('button');
      down.className = 'arrow-btn';
      down.innerHTML = '<i class="fa-solid fa-arrow-down"></i>';
      down.disabled = idx === list.length - 1;
      down.onclick = () => moveItem(item.id, 1);
      tdArrows.appendChild(up);
      tdArrows.appendChild(down);
      tr.appendChild(tdArrows);

      tbody.appendChild(tr);
    });

    updateEditButton();
  }

  function moveItem(id, dir) {
    const list = queues[currentTab];
    const i = list.findIndex(x => x.id === id);
    if (i < 0) return;
    const j = i + dir;
    if (j < 0 || j >= list.length) return;
    [list[i], list[j]] = [list[j], list[i]];
    saveQueues();
    renderTable();
  }

  function updateEditButton() {
    $('editBtn').disabled = selectedIds.size === 0;
  }

  function openModal(html, onReady, extraClass = '') {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-window ${extraClass}">${html}</div>`;
    document.body.appendChild(overlay);

    const close = () => {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);

    if (onReady) onReady(overlay.querySelector('.modal-window'), close);
    return close;
  }

  function openRecordModal() {
    const datalistOptions = playersList.map(n => `<option value="${escapeHtml(n)}">`).join('');

    openModal(`
      <h3>Записать игрока</h3>
      <div class="modal-field">
        <label>Ник игрока</label>
        <input type="text" id="mNick" list="playersDatalist" placeholder="Начните вводить ник" autocomplete="off">
        <datalist id="playersDatalist">${datalistOptions}</datalist>
      </div>
      <div class="modal-field">
        <label>Количество дней</label>
        <input type="number" id="mDays" min="1" step="1" placeholder="Например, 30">
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="mCancel"><i class="fa-solid fa-xmark"></i> Отмена</button>
        <button class="modal-btn primary" id="mSave"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
      </div>
    `, (win, close) => {
      win.querySelector('#mCancel').onclick = close;
      win.querySelector('#mSave').onclick = async () => {
        const nick = win.querySelector('#mNick').value.trim();
        const days = parseInt(win.querySelector('#mDays').value, 10);
        if (!nick) return alert('Введите ник');
        if (!days || days < 1) return alert('Введите корректное количество дней');

        const existsInList = playersList.some(p => p.toLowerCase() === nick.toLowerCase());
        if (!existsInList) {
          const shouldAdd = confirm(
            `Игрока «${nick}» нет в общем списке игроков.\n\n` +
            `Добавить его в список, чтобы в следующий раз он предлагался при вводе?`
          );
          if (shouldAdd) {
            playersList.push(nick);
            playersList.sort((a, b) => a.localeCompare(b, 'ru'));
            await savePlayers();
          }
        }

        const boosters = calculateBoosters(days, settings[currentTab]);
        queues[currentTab].push({ id: genId(), nick, days, boosters });
        await saveQueues();
        renderTable();
        close();
      };
      setTimeout(() => win.querySelector('#mNick').focus(), 50);
    });
  }

  function openRewriteModal() {
    if (selectedIds.size !== 1) return alert('Выберите ровно одного игрока');
    const id = [...selectedIds][0];
    const list = queues[currentTab];
    const item = list.find(x => x.id === id);
    if (!item) return;

    openModal(`
      <h3>Перезаписать в конец</h3>
      <div class="modal-field">
        <label>Ник</label>
        <input type="text" value="${escapeHtml(item.nick)}" readonly>
      </div>
      <div class="modal-field">
        <label>Новое количество дней</label>
        <input type="number" id="rDays" min="1" step="1" value="${item.days}">
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="rCancel"><i class="fa-solid fa-xmark"></i> Отмена</button>
        <button class="modal-btn primary" id="rSave"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
      </div>
    `, (win, close) => {
      win.querySelector('#rCancel').onclick = close;
      win.querySelector('#rSave').onclick = async () => {
        const newDays = parseInt(win.querySelector('#rDays').value, 10);
        if (!newDays || newDays < 1) return alert('Введите корректное количество дней');
        const i = list.findIndex(x => x.id === id);
        const [removed] = list.splice(i, 1);
        removed.days = newDays;
        removed.boosters = calculateBoosters(newDays, settings[currentTab]);
        list.push(removed);
        selectedIds.clear();
        await saveQueues();
        renderTable();
        close();
      };
    });
  }

  function openEditModal() {
    if (selectedIds.size === 0) return;
    const list = queues[currentTab];
    const items = list.filter(x => selectedIds.has(x.id));
    if (!items.length) return;

    const rowsHTML = items.map(it => `
      <div class="player-edit-row" data-id="${it.id}">
        <div class="modal-field">
          <label>Ник</label>
          <input type="text" class="e-nick" value="${escapeHtml(it.nick)}">
        </div>
        <div class="modal-field">
          <label>Дней</label>
          <input type="number" class="e-days" min="1" step="1" value="${it.days}">
        </div>
      </div>
    `).join('');

    openModal(`
      <h3>Изменить игроков</h3>
      ${rowsHTML}
      <div class="modal-actions">
        <button class="modal-btn secondary" id="eCancel"><i class="fa-solid fa-xmark"></i> Отмена</button>
        <button class="modal-btn primary" id="eSave"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
      </div>
    `, (win, close) => {
      win.querySelector('#eCancel').onclick = close;
      win.querySelector('#eSave').onclick = async () => {
        const rows = win.querySelectorAll('.player-edit-row');
        let ok = true;
        const updates = [];
        rows.forEach(r => {
          const id = r.dataset.id;
          const nick = r.querySelector('.e-nick').value.trim();
          const days = parseInt(r.querySelector('.e-days').value, 10);
          if (!nick || !days || days < 1) { ok = false; return; }
          updates.push({ id, nick, days });
        });
        if (!ok) return alert('Проверьте поля: ник не пустой, дни ≥ 1');

        updates.forEach(u => {
          const it = list.find(x => x.id === u.id);
          if (it) {
            it.nick = u.nick;
            it.days = u.days;
            it.boosters = calculateBoosters(u.days, settings[currentTab]);
          }
        });
        selectedIds.clear();
        await saveQueues();
        renderTable();
        close();
      };
    });
  }

  async function finishSelected() {
    if (selectedIds.size === 0) return alert('Выберите хотя бы одного игрока');
    queues[currentTab] = queues[currentTab].filter(x => !selectedIds.has(x.id));
    selectedIds.clear();
    await saveQueues();
    renderTable();
  }

  function copyRange(from, to) {
    const list = queues[currentTab];
    const label = currentTab === 'build' ? 'Стройка' : 'Исследования';
    const slice = list.slice(from - 1, to);
    if (!slice.length) return alert(`В диапазоне ${from}-${to} нет игроков`);
    const lines = slice.map((it, i) => `${from + i}. ${it.nick}: ${it.boosters ?? '—'}`);
    const text = `Очередь ${label}:\n` + lines.join('\n');

    navigator.clipboard.writeText(text).then(
      () => alert('Скопировано:\n\n' + text),
      () => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
        alert('Скопировано:\n\n' + text);
      }
    );
  }

  function computeBoostersForDays(days, pct, target) {
    if (days <= target) return 0;
    if (pct <= 0 || pct >= 1) return '—';
    return Math.ceil( Math.log(target / days) / Math.log(1 - pct) );
  }

  function groupBoosters(minDay, maxDay, pct, target) {
    const groups = [];
    let cur = null;
    for (let d = minDay; d <= maxDay; d++) {
      const n = computeBoostersForDays(d, pct, target);

      if (n === '—' || typeof n !== 'number' || n < 3) {
        if (cur) { groups.push(cur); cur = null; }
        continue;
      }

      if (cur && cur.n === n && cur.end === d - 1) {
        cur.end = d;
      } else {
        if (cur) groups.push(cur);
        cur = { start: d, end: d, n };
      }
    }
    if (cur) groups.push(cur);
    if (groups.length) groups[groups.length - 1].plus = true;
    return groups;
  }

  function groupLabel(g) {
    if (g.start === g.end) return `${g.start}${g.plus ? '+' : ''}`;
    return `${g.start}-${g.end}${g.plus ? '+' : ''}`;
  }

  function openBoostersTableModal() {
    let currentTarget = settings[currentTab].targetDays;

    function buildColumns(target) {
      const cols = [5, 10, 15];
      return `<div class="boosters-grid">` + cols.map(pct => {
        const groups = groupBoosters(10, 150, pct / 100, target);
        const rows = groups.map(g =>
          `<li><span class="days">${groupLabel(g)}</span><span class="count">${g.n} шт.</span></li>`
        ).join('');
        return `
          <div class="boosters-col" data-pct="${pct}">
            <div class="boosters-col-header">
              <i class="fa-solid fa-chevron-right arrow-icon"></i>
              <h4>${pct}%</h4>
              <button class="copy-col-btn" data-pct="${pct}" title="Скопировать"><i class="fa-solid fa-copy"></i></button>
            </div>
            <div class="boosters-col-body">
              <ul>${rows}</ul>
            </div>
          </div>
        `;
      }).join('') + `</div>`;
    }

    openModal(`
      <h3>Таблица баффов</h3>
      <div class="target-switch">
        <button class="target-btn" data-target="7"><i class="fa-solid fa-bullseye"></i> До 7 дней</button>
        <button class="target-btn" data-target="10"><i class="fa-solid fa-bullseye"></i> До 10 дней</button>
      </div>
      <div id="boostersContent"></div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="bClose"><i class="fa-solid fa-xmark"></i> Закрыть</button>
      </div>
    `, (win, close) => {
      function render() {
        win.querySelector('#boostersContent').innerHTML = buildColumns(currentTarget);

        win.querySelectorAll('.target-btn').forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.target, 10) === currentTarget);
        });

        win.querySelectorAll('.boosters-col').forEach(col => {
          const header  = col.querySelector('.boosters-col-header');
          const copyBtn = col.querySelector('.copy-col-btn');

          header.onclick = (e) => {
            if (e.target.closest('.copy-col-btn')) return;

            const wasExpanded = col.classList.contains('expanded');

            // Закрываем все колонки
            win.querySelectorAll('.boosters-col').forEach(c => c.classList.remove('expanded'));

            // Если текущая была свёрнута — раскрываем её
            if (!wasExpanded) col.classList.add('expanded');
          };

          copyBtn.onclick = (e) => {
            e.stopPropagation();
            const pct = parseInt(copyBtn.dataset.pct, 10);
            const groups = groupBoosters(10, 150, pct / 100, currentTarget);
            const lines = groups.map(g => `${groupLabel(g)}: ${g.n} шт.`);
            const text = `Количество баффов на количество дней:\n` + lines.join('\n');
            navigator.clipboard.writeText(text).then(
              () => alert(`Скопировано (${pct}%):\n\n` + text),
              () => {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); ta.remove();
                alert(`Скопировано (${pct}%):\n\n` + text);
              }
            );
          };
        });
      }

      win.querySelectorAll('.target-btn').forEach(b => {
        b.onclick = () => {
          currentTarget = parseInt(b.dataset.target, 10);
          render();
        };
      });

      win.querySelector('#bClose').onclick = close;
      render();
    }, 'wide');
  }

  function openSettingsModal() {
    const s = settings[currentTab];
    const tabLabel = currentTab === 'build' ? 'Строительство' : 'Исследования';

    openModal(`
      <h3>Настройки · ${tabLabel}</h3>
      <div class="settings-section">
        <h4>Ускорять до:</h4>
        <div class="modal-field">
          <select id="sTarget">
            <option value="7" ${s.targetDays===7?'selected':''}>7 дней</option>
            <option value="10" ${s.targetDays===10?'selected':''}>10 дней</option>
          </select>
        </div>
      </div>
      <div class="settings-section">
        <h4>Тип расчёта:</h4>
        <div class="radio-group">
          <label><input type="radio" name="calcType" value="fixed" ${s.calcType==='fixed'?'checked':''}> Фиксированный %</label>
          <label><input type="radio" name="calcType" value="average" ${s.calcType==='average'?'checked':''}> Средний %</label>
        </div>
      </div>
      <div class="settings-section" id="fixedBlock" style="${s.calcType==='fixed'?'':'display:none'}">
        <h4>Фиксированный процент:</h4>
        <div class="modal-field">
          <select id="sFixed">
            <option value="5"  ${s.fixedPercent===5?'selected':''}>5%</option>
            <option value="10" ${s.fixedPercent===10?'selected':''}>10%</option>
            <option value="15" ${s.fixedPercent===15?'selected':''}>15%</option>
          </select>
        </div>
      </div>
      <div class="settings-section" id="avgBlock" style="${s.calcType==='average'?'':'display:none'}">
        <h4>Количество баффов:</h4>
        <div class="modal-field">
          <label>5% баффов</label>
          <input type="number" id="sAvg5" min="0" step="1" value="${s.avg5}">
        </div>
        <div class="modal-field">
          <label>10% баффов</label>
          <input type="number" id="sAvg10" min="0" step="1" value="${s.avg10}">
        </div>
        <div class="modal-field">
          <label>15% баффов</label>
          <input type="number" id="sAvg15" min="0" step="1" value="${s.avg15}">
        </div>
        <div id="avgResult" style="
          margin-top:12px; padding:12px 16px; border-radius:16px;
          background: var(--row-hover); border:1px solid var(--app-border);
          text-align:center; font-size:.95rem; font-weight:600;
          color: var(--accent-1);
        ">
          Средний процент: —
        </div>
      </div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="sCancel"><i class="fa-solid fa-xmark"></i> Отмена</button>
        <button class="modal-btn primary" id="sSave"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
      </div>
    `, (win, close) => {
      const fixedBlock = win.querySelector('#fixedBlock');
      const avgBlock = win.querySelector('#avgBlock');
      win.querySelectorAll('input[name="calcType"]').forEach(r => {
        r.addEventListener('change', () => {
          if (r.checked && r.value === 'fixed') {
            fixedBlock.style.display = '';
            avgBlock.style.display = 'none';
          } else if (r.checked && r.value === 'average') {
            fixedBlock.style.display = 'none';
            avgBlock.style.display = '';
          }
        });
      });

      const avg5Input  = win.querySelector('#sAvg5');
      const avg10Input = win.querySelector('#sAvg10');
      const avg15Input = win.querySelector('#sAvg15');
      const avgResult  = win.querySelector('#avgResult');

      function updateAvgDisplay() {
        const a5  = Math.max(0, parseInt(avg5Input.value, 10)  || 0);
        const a10 = Math.max(0, parseInt(avg10Input.value, 10) || 0);
        const a15 = Math.max(0, parseInt(avg15Input.value, 10) || 0);
        const total = a5 + a10 + a15;

        if (total === 0) {
          avgResult.textContent = 'Средний процент: —';
          return;
        }
        const avgPct = (5*a5 + 10*a10 + 15*a15) / total;
        const formatted = Number(avgPct.toFixed(2));
        avgResult.textContent = `Средний процент: ${formatted}%`;
      }

      [avg5Input, avg10Input, avg15Input].forEach(inp => {
        inp.addEventListener('input', updateAvgDisplay);
      });
      updateAvgDisplay();

      win.querySelector('#sCancel').onclick = close;
      win.querySelector('#sSave').onclick = async () => {
        settings[currentTab] = {
          targetDays: parseInt(win.querySelector('#sTarget').value, 10),
          calcType: win.querySelector('input[name="calcType"]:checked').value,
          fixedPercent: parseInt(win.querySelector('#sFixed').value, 10),
          avg5: Math.max(0, parseInt(win.querySelector('#sAvg5').value, 10) || 0),
          avg10: Math.max(0, parseInt(win.querySelector('#sAvg10').value, 10) || 0),
          avg15: Math.max(0, parseInt(win.querySelector('#sAvg15').value, 10) || 0)
        };
        await saveSettings();
        recalcAll();
        renderTable();
        close();
      };
    });
  }

  function openThemeModal() {
    const options = THEMES.map(t => `
      <label class="theme-option">
        <input type="radio" name="themePick" value="${t}" ${t===currentTheme?'checked':''}>
        <span>${THEME_NAMES[t]}</span>
      </label>
    `).join('');

    openModal(`
      <h3>Выбор темы</h3>
      <div>${options}</div>
      <div class="modal-actions">
        <button class="modal-btn primary" id="themeSave"><i class="fa-solid fa-check"></i> Применить</button>
      </div>
    `, (win, close) => {
      win.querySelector('#themeSave').onclick = () => {
        const picked = win.querySelector('input[name="themePick"]:checked').value;
        applyTheme(picked);
        saveUserTheme(picked);
        close();
      };
    });
  }

  function openPlayersModal() {
    function renderRows() {
      if (!playersList.length) return '<p style="text-align:center; color:var(--text-muted); font-style:italic;">Список пуст</p>';
      return playersList.map((nick, i) => `
        <div class="players-list-row">
          <input type="text" class="player-nick-input" data-idx="${i}" value="${escapeHtml(nick)}">
          <button class="remove-player" data-idx="${i}"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    openModal(`
      <h3>Список игроков</h3>
      <div id="playersListContainer" style="max-height:50vh; overflow-y:auto;">${renderRows()}</div>
      <div class="modal-field" style="margin-top:14px;">
        <label>Добавить игрока</label>
        <input type="text" id="newPlayerNick" placeholder="Ник">
      </div>
      <div class="modal-actions-stack">
        <button class="modal-btn danger full-width" id="playersClear"><i class="fa-solid fa-trash-can"></i> Очистить всё</button>
        <div class="modal-actions">
          <button class="modal-btn secondary" id="playersCancel"><i class="fa-solid fa-xmark"></i> Отмена</button>
          <button class="modal-btn primary" id="playersSave"><i class="fa-solid fa-floppy-disk"></i> Сохранить</button>
        </div>
      </div>
    `, (win, close) => {
      function attachRemoveHandlers() {
        win.querySelectorAll('.remove-player').forEach(btn => {
          btn.onclick = () => {
            const idx = parseInt(btn.dataset.idx, 10);
            playersList.splice(idx, 1);
            win.querySelector('#playersListContainer').innerHTML = renderRows();
            attachRemoveHandlers();
          };
        });
      }
      attachRemoveHandlers();

      win.querySelector('#playersClear').onclick = async () => {
        if (playersList.length === 0) return alert('Список игроков уже пуст');

        const step1 = confirm(
          `ВНИМАНИЕ!\n\n` +
          `Будут удалены ВСЕ игроки из общего списка (${playersList.length} чел.).\n\n` +
          `Очереди при этом НЕ тронутся.\n\n` +
          `Продолжить?`
        );
        if (!step1) return;

        const step2 = confirm(`Это действие НЕЛЬЗЯ отменить.\n\nВы точно хотите очистить список игроков?`);
        if (!step2) return;

        playersList = [];
        await savePlayers();
        win.querySelector('#playersListContainer').innerHTML = renderRows();
        attachRemoveHandlers();
        alert('Список игроков очищен.');
      };

      win.querySelector('#playersCancel').onclick = close;

      win.querySelector('#playersSave').onclick = async () => {
        win.querySelectorAll('.player-nick-input').forEach(inp => {
          const idx = parseInt(inp.dataset.idx, 10);
          const val = inp.value.trim();
          if (val) playersList[idx] = val;
        });
        const newNick = win.querySelector('#newPlayerNick').value.trim();
        if (newNick && !playersList.includes(newNick)) playersList.push(newNick);

        playersList = [...new Set(playersList.filter(n => n && n.trim()))];
        playersList.sort((a, b) => a.localeCompare(b, 'ru'));

        await savePlayers();
        close();
      };
    });
  }

  async function clearAllQueues() {
    const total = queues.build.length + queues.research.length;
    if (total === 0) return alert('Все очереди уже пусты');

    const step1 = confirm(
      `ВНИМАНИЕ!\n\n` +
      `Будут удалены ВСЕ записи из обеих очередей:\n` +
      `• Строительство: ${queues.build.length} игроков\n` +
      `• Исследования: ${queues.research.length} игроков\n\n` +
      `Всего: ${total} записей.\n\nПродолжить?`
    );
    if (!step1) return;

    const step2 = confirm(`Это действие НЕЛЬЗЯ отменить.\n\nВы точно хотите очистить все очереди?`);
    if (!step2) return;

    queues.build = [];
    queues.research = [];
    selectedIds.clear();
    await saveQueues();
    renderTable();
    alert('Все очереди очищены.');
  }

  function bindEvents() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentTab = btn.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
        selectedIds.clear();
        renderTable();
      });
    });

    $('gearBtn').addEventListener('click', openSettingsModal);
    $('themeBtn').addEventListener('click', openThemeModal);
    $('playersBtn').addEventListener('click', openPlayersModal);
    $('boostersBtn').addEventListener('click', openBoostersTableModal);
    $('recordBtn').addEventListener('click', openRecordModal);
    $('rewriteBtn').addEventListener('click', openRewriteModal);
    $('editBtn').addEventListener('click', openEditModal);
    $('finishBtn').addEventListener('click', finishSelected);
    $('clearQueuesBtn').addEventListener('click', clearAllQueues);

    $('copy1_10').addEventListener('click', () => copyRange(1, 10));
    $('copy11_20').addEventListener('click', () => copyRange(11, 20));
    $('copy21_30').addEventListener('click', () => copyRange(21, 30));
  }

  (async () => {
    try {
      await waitForFirebase();
      const theme = await loadUserTheme();
      applyTheme(theme);
      await Promise.all([loadData(), loadPlayers()]);
      recalcAll();
      bindEvents();
      renderTable();
      subscribeToChanges();
    } catch(e) {
      console.error('Ошибка инициализации:', e);
      alert('Не удалось подключиться к базе данных. Проверьте интернет и обновите страницу.');
    }
  })();

})();
</script>
</body>
</html>
