<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEX Dragons · Очереди (просмотр)</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }

  :root {
    --bg-gradient-1: #eef2f7;
    --bg-gradient-2: #dde4ee;
    --app-bg: rgba(255,255,255,.88);
    --app-border: rgba(120,140,170,.3);
    --app-shadow: rgba(100,120,160,.15);
    --text-main: #1e2a3a;
    --text-sub: #4a5a70;
    --text-muted: #8494a8;
    --accent-1: #4a6fa5;
    --accent-2: #6b8fc4;
    --accent-hover: #5878ad;
    --tab-bg: rgba(220,230,242,.8);
    --tab-active-1: #6b8fc4;
    --tab-active-2: #4a6fa5;
    --btn-bg: rgba(232,238,246,.95);
    --btn-border: rgba(120,140,170,.4);
    --table-bg: rgba(255,255,255,.75);
    --thead-bg: rgba(200,215,232,.95);
    --row-hover: rgba(107,143,196,.1);
    --row-border: rgba(150,170,195,.3);
    --modal-bg-1: #ffffff;
    --modal-bg-2: #eef2f7;
    --accent-glow: #6b8fc4;
    --sticky-bg: #ffffff;
    --sticky-head-bg: #c8d7e8;
  }

  body {
    background: linear-gradient(145deg, var(--bg-gradient-1) 0%, var(--bg-gradient-2) 100%);
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    padding:12px; color: var(--text-main);
  }
  .app-container {
    width:100%; max-width:1100px;
    background: var(--app-bg);
    backdrop-filter: blur(12px);
    border-radius:32px; padding:20px 18px 28px;
    box-shadow: 0 25px 50px -8px rgba(0,0,0,.35), 0 0 0 1px var(--app-shadow);
    border:1px solid var(--app-border);
  }
  .clan-title {
    text-align:center; font-size:2.1rem; font-weight:800; letter-spacing:1px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:4px;
  }
  .sub-title {
    text-align:center; font-size:1.1rem; color: var(--text-sub); letter-spacing:2px;
    text-transform:uppercase; margin-bottom:18px;
    border-bottom:1px solid var(--app-border); padding-bottom:10px;
  }

  .top-bar { display:flex; justify-content:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .top-btn {
    background: var(--btn-bg); border:1px solid var(--btn-border);
    color: var(--text-main); font-size:.9rem; font-weight:600;
    padding:10px 20px; border-radius:30px; cursor:pointer;
    transition: all .2s;
    display:inline-flex; align-items:center; gap:8px;
  }
  .top-btn:hover { background: var(--accent-hover); color:#fff; box-shadow:0 0 14px var(--accent-glow); }

  .tabs { display:flex; align-items:center; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .tab-btn {
    background: var(--tab-bg); border:1px solid var(--btn-border);
    color: var(--text-sub); font-size:1rem; font-weight:600; padding:10px 18px;
    border-radius:40px; cursor:pointer; transition:all .2s; flex:1 0 auto;
    text-align:center;
  }
  .tab-btn.active {
    background: linear-gradient(145deg, var(--tab-active-1), var(--tab-active-2));
    border-color: var(--accent-1); color:#fff;
    box-shadow:0 0 18px var(--accent-glow), 0 4px 12px rgba(0,0,0,.15);
  }
  .tab-btn:hover { background: var(--accent-hover); color:#fff; }

  .action-bar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; justify-content:center; }
  .action-btn {
    background: var(--btn-bg); border:1px solid var(--btn-border);
    color: var(--text-main); font-size:.8rem; font-weight:600; padding:8px 12px;
    border-radius:30px; cursor:pointer; transition:all .15s;
    display:inline-flex; align-items:center; gap:6px;
  }
  .action-btn:hover { background: var(--accent-hover); color:#fff; box-shadow:0 0 12px var(--accent-glow); }

  .table-outer {
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--app-border);
    background: var(--table-bg);
    box-shadow: inset 0 0 0 1px var(--app-shadow);
  }
  .table-wrapper {
    overflow: auto;
    max-height: 65vh;
    border-radius: 20px;
    scrollbar-gutter: stable;
  }

  table {
    width:100%;
    border-collapse: separate;
    border-spacing: 0;
    min-width:520px;
    font-size:.9rem;
  }
  th {
    background: var(--thead-bg); color: var(--text-main); font-weight:600;
    padding:12px 6px; text-align:center; position:sticky; top:0;
    backdrop-filter:blur(12px); border-bottom:1px solid var(--accent-2); font-size:.85rem;
    z-index: 5;
  }
  td { padding:10px 6px; text-align:center; border-bottom:1px solid var(--row-border); color: var(--text-main); }
  tr:hover { background: var(--row-hover); }
  .empty-message { text-align:center; padding:30px; color: var(--text-muted); font-style:italic; }

  th.sticky-col, td.sticky-col { position: sticky; z-index: 2; }
  th.sticky-col { z-index: 6; }
  .sticky-num {
    left: 0;
    width: 26px; 
   min-width: 26px; 
   max-width: 26px;
    text-align: center;
  }
  .sticky-nick {
    left: 26px;
    min-width: 20px; 
    max-width: 40px;
    text-align: left;
    padding-left: 10px;
    overflow: hidden;
    text-overflow: ellipsis;
    box-shadow: inset -8px 0 8px -8px rgba(0,0,0,.35);
  }
  tbody td.sticky-col { background-color: var(--sticky-bg); }
  thead th.sticky-col { background-color: var(--sticky-head-bg); }
  tbody tr:hover td.sticky-col {
    background-image: linear-gradient(var(--row-hover), var(--row-hover));
  }

  .modal-overlay {
    position:fixed; inset:0; background:rgba(0,0,0,.5);
    backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center;
    padding:16px; z-index:1000; animation:fadeIn .25s;
  }
  .modal-window {
    background: linear-gradient(145deg, var(--modal-bg-1), var(--modal-bg-2));
    border:1px solid var(--accent-2); border-radius:28px;
    padding:24px 20px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto;
    box-shadow:0 30px 50px rgba(0,0,0,.5);
    animation:slideUp .3s; color: var(--text-main);
  }
  .modal-window.wide { max-width: 780px; }
  .modal-window h3 {
    font-size:1.5rem; margin-bottom:18px; text-align:center;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .modal-actions { display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .modal-btn {
    padding:12px 20px; border-radius:40px; font-weight:700; font-size:.9rem;
    border:none; cursor:pointer; transition:all .2s; flex:1; min-width:100px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    white-space: nowrap;
  }
  .modal-btn.secondary {
    background: var(--btn-bg); color: var(--text-main); border:1px solid var(--btn-border);
  }
  .modal-btn.secondary:hover { background: var(--accent-hover); color:#fff; }

  .target-switch {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .target-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 30px;
    cursor: pointer;
    font-size: .85rem;
    font-weight: 600;
    transition: all .2s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .target-btn:hover { background: var(--accent-hover); color: #fff; }
  .target-btn.active {
    background: linear-gradient(145deg, var(--accent-1), var(--accent-2));
    color: #fff;
    border-color: var(--accent-1);
    box-shadow: 0 0 14px var(--accent-glow);
  }

  .boosters-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .boosters-col {
    background: var(--row-hover);
    border-radius: 16px;
    padding: 10px;
    border: 1px solid var(--app-border);
  }
  .boosters-col-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--app-border);
  }
  .boosters-col-header h4 {
    color: var(--accent-1);
    font-size: 1rem;
    font-weight: 700;
    flex: 1;
    text-align: center;
  }
  .copy-col-btn {
    background: var(--btn-bg);
    border: 1px solid var(--btn-border);
    color: var(--text-main);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all .2s;
    flex-shrink: 0;
  }
  .copy-col-btn:hover {
    background: var(--accent-hover);
    color: #fff;
    box-shadow: 0 0 10px var(--accent-glow);
  }
  .copy-col-btn i { font-size: .8rem; }

  .boosters-col ul {
    list-style: none;
    max-height: 48vh;
    overflow-y: auto;
    padding-right: 4px;
  }
  .boosters-col li {
    padding: 5px 6px;
    font-size: .8rem;
    border-bottom: 1px solid var(--row-border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
    white-space: nowrap;
  }
  .boosters-col li:last-child { border-bottom: none; }
  .boosters-col li .days { color: var(--text-sub); }
  .boosters-col li .count { color: var(--accent-1); font-weight: 700; }

  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  @keyframes slideUp { from{opacity:0; transform:translateY(30px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }

  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; border-radius: 10px; }
  *::-webkit-scrollbar-thumb {
    background: linear-gradient(145deg, var(--accent-2), var(--accent-1));
    border-radius: 10px;
    border: 2px solid transparent;
    background-clip: padding-box;
  }
  *::-webkit-scrollbar-thumb:hover {
    background: var(--accent-hover);
    background-clip: padding-box;
    border: 2px solid transparent;
  }
  * { scrollbar-width: thin; scrollbar-color: var(--accent-2) transparent; }

  @media (max-width:600px) {
    *::-webkit-scrollbar { width: 6px; height: 6px; }
    *::-webkit-scrollbar-thumb { border-width: 1px; }
    .clan-title { font-size:1.6rem; }
    .sub-title { font-size:.9rem; }
    .tab-btn { font-size:.85rem; padding:8px 10px; }
    .action-btn { font-size:.7rem; padding:6px 8px; }
    table { font-size:.75rem; min-width:420px; }
    th, td { padding:8px 3px; }
    .modal-window { padding:18px 14px; border-radius:24px; }
    .modal-btn { padding:10px 12px; font-size:.82rem; }
    .sticky-num { width: 38px; min-width: 38px; max-width: 38px; }
    .sticky-nick { left: 38px; min-width: 100px; max-width: 140px; padding-left: 8px; }
    .boosters-grid { grid-template-columns: 1fr; gap: 10px; }
    .boosters-col ul { max-height: none; }
  }
</style>
</head>
<body>

  <div class="top-bar">

<script>
(function(){
  "use strict";

  let currentTab = 'build';
  let queues = { build: [], research: [] };
  let settings = {
    build:    { targetDays: 7, calcType: 'fixed', fixedPercent: 10, avg5: 0, avg10: 0, avg15: 0 },
    research: { targetDays: 7, calcType: 'fixed', fixedPercent: 10, avg5: 0, avg10: 0, avg15: 0 }
  };

  const $ = id => document.getElementById(id);
  const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  function waitForFirebase() {
    return new Promise((resolve, reject) => {
      let attempts = 0;
      const check = () => {
        if (window.firebaseDB) resolve();
        else if (++attempts > 200) reject(new Error('Firebase timeout'));
        else setTimeout(check, 50);
      };
      check();
    });
  }

  async function loadData() {
    await waitForFirebase();
    const { db, doc, getDoc } = window.firebaseDB;
    try {
      const [qB, qR, sB, sR] = await Promise.all([
        getDoc(doc(db, 'queues', 'build')),
        getDoc(doc(db, 'queues', 'research')),
        getDoc(doc(db, 'settings', 'build')),
        getDoc(doc(db, 'settings', 'research'))
      ]);
      if (qB.exists()) queues.build    = qB.data().list || [];
      if (qR.exists()) queues.research = qR.data().list || [];
      if (sB.exists()) settings.build    = { ...settings.build,    ...sB.data() };
      if (sR.exists()) settings.research = { ...settings.research, ...sR.data() };
    } catch(e){ console.error('loadData error:', e); }
  }

  function subscribeToChanges() {
    const { db, doc, onSnapshot } = window.firebaseDB;

    ['build', 'research'].forEach(tab => {
      onSnapshot(doc(db, 'settings', tab), (snap) => {
        if (!snap.exists()) return;
        settings[tab] = { ...settings[tab], ...snap.data() };
        const s = settings[tab];
        queues[tab].forEach(item => {
          item.boosters = calculateBoosters(item.days, s);
        });
        if (tab === currentTab) renderTable();
      });
    });

    ['build', 'research'].forEach(tab => {
      onSnapshot(doc(db, 'queues', tab), (snap) => {
        if (!snap.exists()) return;
        queues[tab] = snap.data().list || [];
        const s = settings[tab];
        queues[tab].forEach(item => {
          item.boosters = calculateBoosters(item.days, s);
        });
        if (tab === currentTab) renderTable();
      });
    });
  }

  function calculateBoosters(days, s) {
    const target = s.targetDays;
    if (days <= target) return 0;

    let pct;
    if (s.calcType === 'fixed') {
      pct = s.fixedPercent / 100;
    } else {
      const total = (s.avg5||0) + (s.avg10||0) + (s.avg15||0);
      if (total <= 0) return '—';
      pct = (5*(s.avg5||0) + 10*(s.avg10||0) + 15*(s.avg15||0)) / total / 100;
    }

    if (pct <= 0 || pct >= 1) return '—';
    return Math.ceil( Math.log(target / days) / Math.log(1 - pct) );
  }

  function recalcAll() {
    ['build','research'].forEach(tab => {
      const s = settings[tab];
      queues[tab].forEach(item => {
        item.boosters = calculateBoosters(item.days, s);
      });
    });
  }

  function renderTable() {
    const tbody = $('tableBody');
    const list = queues[currentTab];
    tbody.innerHTML = '';

    if (!list.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="4" class="empty-message">Очередь пуста.</td>`;
      tbody.appendChild(tr);
      return;
    }

    list.forEach((item, idx) => {
      const tr = document.createElement('tr');

      const tdNum = document.createElement('td');
      tdNum.className = 'sticky-col sticky-num';
      tdNum.textContent = idx + 1;
      tr.appendChild(tdNum);

      const tdNick = document.createElement('td');
      tdNick.className = 'sticky-col sticky-nick';
      tdNick.textContent = item.nick;
      tdNick.title = item.nick;
      tr.appendChild(tdNick);

      const tdDays = document.createElement('td');
      tdDays.textContent = item.days;
      tr.appendChild(tdDays);

      const tdBoost = document.createElement('td');
      tdBoost.textContent = (item.boosters === undefined || item.boosters === null) ? '—' : item.boosters;
      tr.appendChild(tdBoost);

      tbody.appendChild(tr);
    });
  }

  function copyRange(from, to) {
    const list = queues[currentTab];
    const label = currentTab === 'build' ? 'Стройка' : 'Исследования';
    const slice = list.slice(from - 1, to);
    if (!slice.length) return alert(`В диапазоне ${from}-${to} нет игроков`);
    const lines = slice.map((it, i) => `${from + i}. ${it.nick}: ${it.boosters ?? '—'}`);
    const text = `Очередь ${label}:\n` + lines.join('\n');

    navigator.clipboard.writeText(text).then(
      () => alert('Скопировано:\n\n' + text),
      () => {
        const ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta);
        ta.select(); document.execCommand('copy'); ta.remove();
        alert('Скопировано:\n\n' + text);
      }
    );
  }

  function computeBoostersForDays(days, pct, target) {
    if (days <= target) return 0;
    if (pct <= 0 || pct >= 1) return '—';
    return Math.ceil( Math.log(target / days) / Math.log(1 - pct) );
  }

  function groupBoosters(minDay, maxDay, pct, target) {
    const groups = [];
    let cur = null;
    for (let d = minDay; d <= maxDay; d++) {
      const n = computeBoostersForDays(d, pct, target);

      // Пропускаем дни, где баффов меньше 3
      if (n === '—' || typeof n !== 'number' || n < 3) {
        if (cur) { groups.push(cur); cur = null; }
        continue;
      }

      if (cur && cur.n === n && cur.end === d - 1) {
        cur.end = d;
      } else {
        if (cur) groups.push(cur);
        cur = { start: d, end: d, n };
      }
    }
    if (cur) groups.push(cur);
    if (groups.length) groups[groups.length - 1].plus = true;
    return groups;
  }

  function groupLabel(g) {
    if (g.start === g.end) return `${g.start}${g.plus ? '+' : ''}`;
    return `${g.start}-${g.end}${g.plus ? '+' : ''}`;
  }

  function openModal(html, onReady, extraClass = '') {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-window ${extraClass}">${html}</div>`;
    document.body.appendChild(overlay);

    const close = () => {
      document.removeEventListener('keydown', onKey);
      overlay.remove();
    };
    const onKey = e => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);

    if (onReady) onReady(overlay.querySelector('.modal-window'), close);
    return close;
  }

  function openBoostersTableModal() {
    let currentTarget = settings[currentTab].targetDays;

    function buildColumns(target) {
      const cols = [5, 10, 15];
      return `<div class="boosters-grid">` + cols.map(pct => {
        const groups = groupBoosters(10, 150, pct / 100, target);
        const rows = groups.map(g =>
          `<li><span class="days">${groupLabel(g)}</span><span class="count">${g.n} шт.</span></li>`
        ).join('');
        return `
          <div class="boosters-col">
            <div class="boosters-col-header">
              <h4>${pct}%</h4>
              <button class="copy-col-btn" data-pct="${pct}" title="Скопировать"><i class="fa-solid fa-copy"></i></button>
            </div>
            <ul>${rows}</ul>
          </div>
        `;
      }).join('') + `</div>`;
    }

    openModal(`
      <h3>Таблица баффов</h3>
      <div class="target-switch">
        <button class="target-btn" data-target="7"><i class="fa-solid fa-bullseye"></i> До 7 дней</button>
        <button class="target-btn" data-target="10"><i class="fa-solid fa-bullseye"></i> До 10 дней</button>
      </div>
      <div id="boostersContent"></div>
      <div class="modal-actions">
        <button class="modal-btn secondary" id="bClose"><i class="fa-solid fa-xmark"></i> Закрыть</button>
      </div>
    `, (win, close) => {
      function render() {
        win.querySelector('#boostersContent').innerHTML = buildColumns(currentTarget);
        win.querySelectorAll('.target-btn').forEach(b => {
          b.classList.toggle('active', parseInt(b.dataset.target, 10) === currentTarget);
        });
        win.querySelectorAll('.copy-col-btn').forEach(btn => {
          btn.onclick = () => {
            const pct = parseInt(btn.dataset.pct, 10);
            const groups = groupBoosters(10, 150, pct / 100, currentTarget);
            const lines = groups.map(g => `${groupLabel(g)}: ${g.n} шт.`);
            const text = `Количество баффов на количество дней:\n` + lines.join('\n');
            navigator.clipboard.writeText(text).then(
              () => alert(`Скопировано (${pct}%):\n\n` + text),
              () => {
                const ta = document.createElement('textarea');
                ta.value = text; document.body.appendChild(ta);
                ta.select(); document.execCommand('copy'); ta.remove();
                alert(`Скопировано (${pct}%):\n\n` + text);
              }
            );
          };
        });
      }

      win.querySelectorAll('.target-btn').forEach(b => {
        b.onclick = () => {
          currentTarget = parseInt(b.dataset.target, 10);
          render();
        };
      });

      win.querySelector('#bClose').onclick = close;
      render();
    }, 'wide');
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
      renderTable();
    });
  });

  $('boostersBtn').addEventListener('click', openBoostersTableModal);
  $('copy1_10').addEventListener('click', () => copyRange(1, 10));
  $('copy11_20').addEventListener('click', () => copyRange(11, 20));
  $('copy21_30').addEventListener('click', () => copyRange(21, 30));

  (async () => {
    try {
      await waitForFirebase();
      await loadData();
      recalcAll();
      renderTable();
      subscribeToChanges();
    } catch(e) {
      console.error('Ошибка инициализации:', e);
      alert('Не удалось подключиться к базе данных. Проверьте интернет и обновите страницу.');
    }
  })();

})();
</script>
</body>
</html>
